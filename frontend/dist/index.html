  <body>
    <div id="root"></div>
    <script>
      (function() {
        var colors = { light: '#f6f7fb', dark: '#111827', night: '#0a0a0a' };
        try {
          var s = localStorage.getItem('sunday-theme');
          var theme = (s === 'dark' || s === 'night' || s === 'light') ? s : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', colors[theme]);
        } catch (_) {}
      })();
    </script>
  </body>
